name: Django CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  django-tests:
    name: Django tests / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-7F4tQ8x2
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PORTFOLIO_DEMO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify packaged release assets
        run: python scripts/verify_release.py

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run full test suite
        run: python manage.py test

      - name: Collect static files
        env:
          DJANGO_STATIC_ROOT: /tmp/student-satisfaction-static-ci
        run: python manage.py collectstatic --noinput --clear

  production-smoke:
    name: Production smoke / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: student_satisfaction_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d student_satisfaction_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-production-simulation-only-9Zp7Kx4Wm2Qr8Nv6
      DJANGO_ALLOWED_HOSTS: portfolio.example
      DJANGO_CSRF_TRUSTED_ORIGINS: https://portfolio.example
      DATABASE_URL: postgresql://postgres:postgres-ci-password@127.0.0.1:5432/student_satisfaction_ci
      DJANGO_SECURE_SSL_REDIRECT: "1"
      DJANGO_TRUST_X_FORWARDED_PROTO: "0"
      DJANGO_HSTS_SECONDS: "3600"
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: "0"
      DJANGO_HSTS_PRELOAD: "0"
      PORTFOLIO_DEMO_ENABLED: "1"
      PORTFOLIO_DEMO_USERNAME: portfolio-ci
      PORTFOLIO_DEMO_EMAIL: portfolio-ci@example.invalid
      PORTFOLIO_DEMO_PASSWORD: CI-Portfolio-Only-2026-Quartz
      PORTFOLIO_MODEL_PATH: deployment/model/portfolio_model.joblib

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: V17.4 Vercel runtime dry-run
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
          VERCEL_BUILD_DRY_RUN: "1"
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres-ci-password@127.0.0.1:5432/student_satisfaction_ci
        run: python scripts/vercel_build.py

      - name: Verify packaged model
        run: python scripts/verify_release.py

      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput

      - name: Bootstrap RBAC and portfolio demo
        run: |
          python manage.py setup_roles
          python manage.py bootstrap_portfolio

      - name: Django production checks
        run: python manage.py check --deploy --fail-level ERROR

      - name: Collect production static files
        env:
          DJANGO_STATIC_ROOT: /tmp/student-satisfaction-static-production-ci
        run: python manage.py collectstatic --noinput --clear

      - name: Smoke test packaged ML model
        run: |
          python manage.py shell -c "
          from predictor.neural_network_model import load_current_model, predict_satisfaction
          model = load_current_model()
          assert model is not None
          result = predict_satisfaction(model, {
              'qualite_enseignement': 7,
              'charge_travail': 4,
              'interactivite': 7,
              'type_cours': 'présentiel',
              'niveau_etudiant': 'M1',
          })
          assert result['prediction'] in (0, 1)
          probability = float(result['probability_satisfied'])
          assert 0.0 <= probability <= 100.0
          print('CI_ML_SMOKE_OK', round(probability, 2))
          "

      - name: Smoke test health endpoint
        run: |
          python manage.py shell -c "
          from django.test import Client
          response = Client().get(
              '/health/',
              secure=True,
              HTTP_HOST='portfolio.example',
          )
          assert response.status_code == 200, response.status_code
          assert response.json() == {'status': 'ok'}
          print('CI_HEALTH_OK')
          "
